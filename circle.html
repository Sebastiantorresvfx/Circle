<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Catch the Ball</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none; /* Prevents default page bounce/scroll on mobile */
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      overscroll-behavior: none; /* No pull-to-refresh or rubber-band drag */
      -webkit-text-size-adjust: 100%;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      background-color: #ffd700;
      font-family: Arial, sans-serif;
      transition: background-color 0.5s ease;
    }

    /* Top bar for score, timer and difficulty settings */
    #top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      z-index: 10;
    }

    #stats {
      display: flex;
      gap: 8px;
    }

    .stat {
      font-size: clamp(18px, 4vw, 24px);
      font-weight: bold;
      color: #222;
      background: rgba(255, 255, 255, 0.65);
      padding: 6px 14px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
      font-variant-numeric: tabular-nums;
    }

    #timer-board.low {
      color: #fff;
      background: rgba(198, 40, 40, 0.9);
    }

    #timer-board.bump {
      animation: bump 0.3s ease-out;
    }

    @keyframes bump {
      0% { transform: scale(1); }
      40% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    #difficulty-container {
      display: flex;
      gap: 6px;
    }

    .difficulty-btn {
      padding: 6px 12px;
      font-size: clamp(12px, 3.5vw, 15px);
      font-weight: bold;
      border: 2px solid #222;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .difficulty-btn.active {
      background: #222;
      color: white;
    }

    /* The target circle (and its mirage copy on Hard) */
    #circle, .mirage {
      position: absolute;
      width: clamp(80px, 18vw, 120px);
      height: clamp(80px, 18vw, 120px);
      background-color: #2e7d32;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(55px, 13vw, 85px);
      line-height: 1;
      transition: top 0.2s ease-out, left 0.2s ease-out, background-color 0.5s ease;
      z-index: 5; /* Above the tap marks */
    }

    /* Emoji and diamond sit inside the ball but never catch taps themselves */
    .emoji, .gem {
      pointer-events: none;
    }

    /* Bonus diamonds that appear on the ball */
    .gem {
      position: absolute;
      left: 31%;
      top: 31%;
      width: 38%;
      height: 38%;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 4px;
      animation: gem-pulse 0.5s ease-in-out infinite alternate;
    }

    .gem.blue { background: linear-gradient(135deg, #b3e5fc, #1e88e5); box-shadow: 0 0 14px #42a5f5; }
    .gem.red { background: linear-gradient(135deg, #ff8a80, #d50000); box-shadow: 0 0 14px #ff5252; }
    .gem.gold { background: linear-gradient(135deg, #fff59d, #ffa000); box-shadow: 0 0 14px #ffd740; }
    .gem.green { background: linear-gradient(135deg, #b9f6ca, #00c853); box-shadow: 0 0 14px #69f0ae; }
    .gem.black { background: linear-gradient(135deg, #616161, #000); box-shadow: 0 0 14px #b388ff; }

    @keyframes gem-pulse {
      from { transform: rotate(45deg) scale(0.85); }
      to { transform: rotate(45deg) scale(1.1); }
    }

    /* Green diamond: shows the bigger hit zone around the real ball */
    #circle.big-zone {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), 0 0 0 60px rgba(0, 230, 118, 0.2);
    }

    /* Active bonus timers under the score */
    #effects {
      flex-basis: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    #effects:empty {
      display: none;
    }

    .effect {
      font-size: 14px;
      font-weight: bold;
      color: white;
      padding: 4px 10px;
      border-radius: 10px;
      font-variant-numeric: tabular-nums;
    }

    .effect.red { background: #d50000; }
    .effect.gold { background: #ff8f00; }
    .effect.green { background: #00a844; }
    .effect.black { background: #111; box-shadow: 0 0 0 2px #b388ff; }

    .mirage.fizzle {
      animation: fizzle 0.35s ease-out;
    }

    @keyframes fizzle {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    #toast {
      position: absolute;
      left: 50%;
      top: 40%;
      transform: translate(-50%, -50%) scale(0.8);
      font-size: clamp(28px, 8vw, 44px);
      font-weight: bold;
      color: #222;
      background: rgba(255, 255, 255, 0.85);
      padding: 8px 20px;
      border-radius: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 15;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Marks left where the screen was tapped, so screen recordings show every tap */
    .tap-mark {
      position: absolute;
      width: 44px;
      height: 44px;
      margin: -22px 0 0 -22px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.55);
      background: rgba(0, 0, 0, 0.12);
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.2);
      pointer-events: none;
      z-index: 1; /* Under the ball */
      animation: tap-fade 3s ease-out forwards;
    }

    .tap-mark.hit {
      border-color: rgba(200, 0, 0, 0.6);
      background: rgba(230, 0, 0, 0.4);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.4);
    }

    @keyframes tap-fade {
      0% { opacity: 1; transform: scale(0.6); }
      10% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1); }
    }

    /* Start / game over panel */
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.45);
      z-index: 20;
    }

    #overlay.hidden {
      display: none;
    }

    #panel {
      width: 100%;
      max-width: 360px;
      max-height: 100%;
      overflow-y: auto;
      background: white;
      color: #222;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    /* The only place that may scroll: a long leaderboard on a short screen */
    #panel, #panel * {
      touch-action: pan-y;
    }

    #panel h1 {
      margin: 0 0 6px;
      font-size: 26px;
    }

    #panel p {
      margin: 6px 0;
      font-size: 15px;
      line-height: 1.4;
    }

    .big-score {
      font-size: 44px;
      font-weight: bold;
      margin: 4px 0 10px;
    }

    .panel-btn {
      margin-top: 14px;
      padding: 12px 22px;
      font-size: 17px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    #initials-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    #initials {
      width: 130px;
      padding: 8px;
      font-size: 30px;
      font-weight: bold;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 6px;
      border: 3px solid #222;
      border-radius: 10px;
      user-select: text;
      -webkit-user-select: text;
      touch-action: manipulation;
    }

    .board-title {
      margin: 14px 0 6px;
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .board {
      width: 100%;
      border-collapse: collapse;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
    }

    .board td {
      padding: 5px 6px;
      border-bottom: 1px solid #eee;
    }

    .board td:first-child { width: 30px; color: #888; text-align: right; }
    .board td:nth-child(2) { text-align: left; font-weight: bold; letter-spacing: 2px; }
    .board td:last-child { text-align: right; font-weight: bold; }

    .board tr.me td {
      background: #fff3b0;
    }

    .muted {
      color: #777;
      font-size: 13px !important;
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <div id="stats">
      <div class="stat" id="score-board">Score: <span id="score">0</span></div>
      <div class="stat" id="timer-board">⏱ <span id="timer">60</span></div>
    </div>
    <div id="difficulty-container">
      <button class="difficulty-btn" onclick="setDifficulty('easy')">Easy</button>
      <button class="difficulty-btn active" onclick="setDifficulty('medium')">Medium</button>
      <button class="difficulty-btn" onclick="setDifficulty('hard')">Hard</button>
      <button class="difficulty-btn" id="sound-btn" aria-label="Mute sound" onclick="toggleSound()">🔊</button>
    </div>
    <div id="effects"></div>
  </div>

  <div id="circle"><span class="emoji"></span></div>
  <div id="toast"></div>

  <div id="overlay">
    <div id="panel"></div>
  </div>

  <script>
    const circle = document.getElementById('circle');
    const scoreDisplay = document.getElementById('score');
    const timerDisplay = document.getElementById('timer');
    const timerBoard = document.getElementById('timer-board');
    const overlay = document.getElementById('overlay');
    const panel = document.getElementById('panel');
    const buttons = document.querySelectorAll('.difficulty-btn');
    const topBar = document.getElementById('top-bar');

    const START_SECONDS = 60;
    const SECONDS_PER_HIT = 1;
    const LEADERBOARD_SIZE = 10;
    const RANKED_LEVELS = ['medium', 'hard'];

    // Every 10 hits the circle gets faster
    const HITS_PER_SPEEDUP = 10;
    const SPEEDUP_FACTOR = 0.85;   // each step takes 85% of the previous time
    const MIN_SPEED_FACTOR = 0.35; // never faster than this
    // Hard only: after 20 hits it sometimes splits into a real ball and a mirage
    const MIRAGE_FROM_SCORE = 20;
    const MIRAGE_CHANCE_PER_SECOND = 0.3;

    // Bonus diamonds: one at a time, shown on the ball for a few seconds.
    // You still have to hit the moving ball to collect one.
    const GEM_TYPES = {
      blue: { weight: 30 },  // +5 seconds
      red: { weight: 25 },   // ball moves faster for 5 seconds
      gold: { weight: 20 },  // double points for 10 seconds
      green: { weight: 25 }, // near misses count as hits for 5 seconds
      black: { weight: 15 }  // every hit takes points away for 5 seconds
    };
    const GEM_VISIBLE_MS = 3000;
    const GEM_FIRST_DELAY_MS = [8000, 14000];
    const GEM_GAP_MS = [10000, 18000]; // wait after a diamond goes away
    const BLUE_BONUS_SECONDS = 5;
    const RED_SECONDS = 5;
    const RED_SPEED_FACTOR = 0.6;      // 40% faster
    const GOLD_SECONDS = 10;
    const GREEN_SECONDS = 5;
    const GREEN_RANGE_PX = 60;         // how close a tap must be to count
    const BLACK_SECONDS = 5;

    let score = 0;
    let timeLeft = START_SECONDS;
    let playing = false;
    let countdownTimer = null;
    let emojiTimeout = null;
    let toastTimeout = null;
    let mirage = null;
    let mirageTimer = null;
    let nextSplitAt = 0;
    let gemType = null;
    let gemTimer = null;
    let nextGemAt = 0;
    const effectEnds = { red: 0, gold: 0, green: 0, black: 0 };
    let effectTimers = [];

    const difficultyConfig = {
      easy: {
        evadeDistance: 30,
        speed: '0.35s',
        jumpRange: 160,
        autoMoveMs: 1400
      },
      medium: {
        evadeDistance: 75,
        speed: '0.15s',
        jumpRange: 340,
        autoMoveMs: 750
      },
      hard: {
        evadeDistance: 100,
        speed: '0.08s',
        jumpRange: 'full',
        autoMoveMs: 550
      }
    };

    let currentDifficulty = 'medium';

    // ---- Score storage ----
    // Saved on this device only for now. To share scores between players,
    // replace load/save with calls to an online database; both are async
    // so the rest of the game won't need to change.
    const scoreStore = {
      key: 'catch-the-ball-leaderboard-v1',

      async load(level) {
        try {
          const all = JSON.parse(localStorage.getItem(this.key)) || {};
          const list = Array.isArray(all[level]) ? all[level] : [];
          return list.sort((a, b) => b.score - a.score || a.time - b.time).slice(0, LEADERBOARD_SIZE);
        } catch (e) {
          return [];
        }
      },

      async save(level, entry) {
        const list = await this.load(level);
        list.push(entry);
        const top = list.sort((a, b) => b.score - a.score || a.time - b.time).slice(0, LEADERBOARD_SIZE);
        try {
          const all = JSON.parse(localStorage.getItem(this.key)) || {};
          all[level] = top;
          localStorage.setItem(this.key, JSON.stringify(all));
        } catch (e) {
          // Storage blocked (e.g. private mode) - the board still shows this game
        }
        return top;
      }
    };

    function qualifies(list, finalScore) {
      if (finalScore <= 0) return false;
      if (list.length < LEADERBOARD_SIZE) return true;
      return finalScore > list[list.length - 1].score;
    }

    // Touch screens have no hover, so on mobile the circle dodges around on its own
    const isTouchDevice = window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
    let autoMoveTimer = null;

    function startAutoMove() {
      if (autoMoveTimer) clearTimeout(autoMoveTimer);
      if (!isTouchDevice || !playing) return;
      const base = Math.max(220, difficultyConfig[currentDifficulty].autoMoveMs * speedFactor());
      // Randomize the rhythm a bit so it's harder to predict
      autoMoveTimer = setTimeout(() => {
        moveCircle();
        if (mirage) moveCircle(undefined, undefined, mirage);
        startAutoMove();
      }, base * (0.6 + Math.random() * 0.8));
    }

    function speedFactor() {
      const steps = Math.floor(score / HITS_PER_SPEEDUP);
      const base = Math.max(MIN_SPEED_FACTOR, Math.pow(SPEEDUP_FACTOR, steps));
      return isActive('red') ? base * RED_SPEED_FACTOR : base;
    }

    function moveTransition() {
      const secs = Math.max(0.04, parseFloat(difficultyConfig[currentDifficulty].speed) * speedFactor());
      return `top ${secs}s ease-out, left ${secs}s ease-out, background-color 0.5s ease`;
    }

    function applySpeed() {
      circle.style.transition = moveTransition();
      if (mirage) mirage.style.transition = moveTransition();
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 900);
    }

    function getCircleSize() {
      return circle.getBoundingClientRect().width;
    }

    function setDifficulty(level) {
      currentDifficulty = level;
      buttons.forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase() === level);
      });
      // Switching mid-game would let you dodge a hard run, so it resets the round
      resetGame();
    }

    function getRandomColor() {
      const letters = '0123456789ABCDEF';
      let color = '#';
      for (let i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
      }
      return color;
    }

    function randomizeColors() {
      const newBg = getRandomColor();
      let newCircleColor = getRandomColor();
      while (newCircleColor === newBg) {
        newCircleColor = getRandomColor();
      }
      document.body.style.backgroundColor = newBg;
      circle.style.backgroundColor = newCircleColor;
      if (mirage) mirage.style.backgroundColor = newCircleColor;
    }

    function moveCircle(fromX, fromY, el = circle) {
      const size = getCircleSize();
      const config = difficultyConfig[currentDifficulty];
      const maxX = window.innerWidth - size - 16;
      const maxY = window.innerHeight - size - 16;
      // Keep clear of the top bar, which wraps to two rows on narrow screens
      const minY = topBar.getBoundingClientRect().bottom + 12;

      let newX, newY;

      if (config.jumpRange === 'full' || fromX === undefined) {
        newX = Math.max(16, Math.random() * maxX);
        newY = minY + Math.random() * Math.max(0, maxY - minY);
      } else {
        const curLeft = parseFloat(el.style.left) || 0;
        const curTop = parseFloat(el.style.top) || 0;

        const dirX = (curLeft + size / 2) - fromX;
        const dirY = (curTop + size / 2) - fromY;
        const length = Math.hypot(dirX, dirY) || 1;

        const pushDist = config.jumpRange;
        newX = curLeft + (dirX / length) * pushDist + (Math.random() * 40 - 20);
        newY = curTop + (dirY / length) * pushDist + (Math.random() * 40 - 20);

        newX = Math.max(16, Math.min(maxX, newX));
        newY = Math.max(minY, Math.min(maxY, newY));
      }

      el.style.left = `${newX}px`;
      el.style.top = `${newY}px`;
    }

    function centerCircle() {
      const size = getCircleSize();
      circle.style.left = `${(window.innerWidth - size) / 2}px`;
      circle.style.top = `${(window.innerHeight - size) / 2}px`;
    }

    // Display emoji and set a 5-second timer to clear it
    function setEmoji(emojiChar) {
      document.querySelectorAll('.emoji').forEach(el => { el.textContent = emojiChar; });
    }

    function showEmoji(emojiChar) {
      setEmoji(emojiChar);
      if (emojiTimeout) clearTimeout(emojiTimeout);
      emojiTimeout = setTimeout(() => setEmoji(''), 5000);
    }

    // ---- Bonus diamonds ----
    const randomBetween = ([min, max]) => min + Math.random() * (max - min);
    const isActive = (type) => Date.now() < effectEnds[type];

    function pickGemType() {
      const types = Object.keys(GEM_TYPES);
      const total = types.reduce((sum, t) => sum + GEM_TYPES[t].weight, 0);
      let roll = Math.random() * total;
      for (const t of types) {
        roll -= GEM_TYPES[t].weight;
        if (roll < 0) return t;
      }
      return types[0];
    }

    function maybeSpawnGem() {
      if (!playing || gemType || Date.now() < nextGemAt) return;
      gemType = pickGemType();
      // The mirage shows the same diamond so it doesn't give away the real ball
      [circle, mirage].forEach(el => {
        if (!el) return;
        const gem = document.createElement('span');
        gem.className = `gem ${gemType}`;
        el.appendChild(gem);
      });
      sfx.gemAppear();
      gemTimer = setTimeout(removeGem, GEM_VISIBLE_MS);
    }

    function removeGem() {
      clearTimeout(gemTimer);
      gemType = null;
      document.querySelectorAll('.gem').forEach(g => g.remove());
      nextGemAt = Date.now() + randomBetween(GEM_GAP_MS);
    }

    function collectGem() {
      const type = gemType;
      removeGem();
      sfx.gem(type);

      if (type === 'blue') {
        addTime(BLUE_BONUS_SECONDS);
        showToast(`+${BLUE_BONUS_SECONDS} seconds`);
        return;
      }

      const seconds = { red: RED_SECONDS, gold: GOLD_SECONDS, green: GREEN_SECONDS, black: BLACK_SECONDS }[type];
      effectEnds[type] = Date.now() + seconds * 1000;
      showToast({ red: 'Too fast!', gold: 'Double points!', green: 'Big hit zone!', black: 'Hits cost points!' }[type]);

      if (type === 'red') applySpeed();
      if (type === 'green') circle.classList.add('big-zone');

      // Switch the effect off exactly when it runs out
      effectTimers.push(setTimeout(() => {
        if (type === 'red') applySpeed();
        if (type === 'green') circle.classList.remove('big-zone');
        renderEffects();
      }, seconds * 1000 + 20));
      renderEffects();
    }

    function renderEffects() {
      const labels = { red: '⚡ Fast', gold: '2× Points', green: '◎ Big zone', black: '☠ Minus points' };
      document.getElementById('effects').innerHTML = Object.keys(labels)
        .filter(isActive)
        .map(t => `<span class="effect ${t}">${labels[t]} ${Math.ceil((effectEnds[t] - Date.now()) / 1000)}</span>`)
        .join('');
    }

    function clearBonuses() {
      clearTimeout(gemTimer);
      gemType = null;
      document.querySelectorAll('.gem').forEach(g => g.remove());
      effectTimers.forEach(clearTimeout);
      effectTimers = [];
      Object.keys(effectEnds).forEach(t => { effectEnds[t] = 0; });
      circle.classList.remove('big-zone');
      renderEffects();
    }

    // ---- Mirage (Hard only) ----
    // A copy appears on top of the real ball, then both dart off in different
    // directions, so you can't tell which is which. Hitting the copy scores nothing.
    function maybeSplit() {
      if (currentDifficulty !== 'hard' || score < MIRAGE_FROM_SCORE) return;
      if (mirage || Date.now() < nextSplitAt) return;
      if (Math.random() < MIRAGE_CHANCE_PER_SECOND) split();
    }

    function split() {
      mirage = document.createElement('div');
      mirage.className = 'mirage';
      mirage.style.left = circle.style.left;
      mirage.style.top = circle.style.top;
      mirage.style.backgroundColor = circle.style.backgroundColor;
      mirage.style.transition = moveTransition();
      mirage.innerHTML = circle.innerHTML; // same emoji and diamond as the real ball
      mirage.addEventListener('click', handleMirageHit);
      mirage.addEventListener('touchstart', handleMirageHit, { passive: false });
      document.body.insertBefore(mirage, circle);

      // Wait a frame so both start from the same spot before they separate
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (!mirage) return;
        moveCircle();
        moveCircle(undefined, undefined, mirage);
      }));

      mirageTimer = setTimeout(reunite, 3000 + Math.random() * 2000);
    }

    function handleMirageHit(e) {
      e.preventDefault();
      e.stopPropagation();
      if (!playing || !mirage) return;
      sfx.mirage();
      const el = mirage;
      el.classList.remove('fizzle');
      void el.offsetWidth; // restart the animation
      el.classList.add('fizzle');
      moveCircle(undefined, undefined, el);
    }

    // The mirage glides back into the real ball and disappears
    function reunite() {
      if (!mirage) return;
      const el = mirage;
      mirage = null;
      el.style.pointerEvents = 'none';
      el.style.transition = 'top 0.45s ease-in, left 0.45s ease-in, opacity 0.45s ease-in';
      el.style.left = circle.style.left;
      el.style.top = circle.style.top;
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 500);
      nextSplitAt = Date.now() + 4000;
    }

    function clearMirage() {
      clearTimeout(mirageTimer);
      if (mirage) mirage.remove();
      mirage = null;
      nextSplitAt = 0;
    }

    // ---- Timer ----
    function renderTimer() {
      timerDisplay.textContent = timeLeft;
      timerBoard.classList.toggle('low', timeLeft <= 10);
    }

    function addTime(seconds) {
      timeLeft += seconds;
      renderTimer();
      timerBoard.classList.remove('bump');
      void timerBoard.offsetWidth; // restart the animation
      timerBoard.classList.add('bump');
    }

    function tick() {
      timeLeft--;
      renderTimer();
      if (timeLeft <= 0) {
        endGame();
        return;
      }
      maybeSplit();
      maybeSpawnGem();
      renderEffects();
    }

    // ---- Game flow ----
    function resetGame() {
      playing = false;
      clearInterval(countdownTimer);
      startAutoMove(); // stops it while not playing
      clearMirage();
      clearBonuses();
      music.stop();
      score = 0;
      applySpeed();
      timeLeft = START_SECONDS;
      scoreDisplay.textContent = score;
      renderTimer();
      setEmoji('');
      centerCircle();
      showStartPanel();
    }

    function startGame() {
      overlay.classList.add('hidden');
      playing = true;
      nextGemAt = Date.now() + randomBetween(GEM_FIRST_DELAY_MS);
      countdownTimer = setInterval(tick, 1000);
      startAutoMove();
      music.start(); // must start from the tap on Start, or phones won't play audio
    }

    async function endGame() {
      playing = false;
      clearInterval(countdownTimer);
      startAutoMove();
      clearMirage();
      clearBonuses();
      music.stop();
      sfx.gameOver();
      timeLeft = 0;
      renderTimer();

      const level = currentDifficulty;
      if (!RANKED_LEVELS.includes(level)) {
        showPanel(`
          <h1>Time's up!</h1>
          <div class="big-score">${score}</div>
          <p class="muted">Easy is practice mode. Play Medium or Hard to get on the leaderboard.</p>
          <button class="panel-btn" id="again-btn">Play again</button>
        `);
        return;
      }

      const list = await scoreStore.load(level);
      if (qualifies(list, score)) {
        askInitials(level);
      } else {
        showLeaderboard(level, list, null, 'Not quite top ten this time.');
      }
    }

    function askInitials(level) {
      showPanel(`
        <h1>Top ten!</h1>
        <div class="big-score">${score}</div>
        <form id="initials-form" autocomplete="off">
          <p>Enter your initials</p>
          <input id="initials" aria-label="Your initials" maxlength="3" autocapitalize="characters" spellcheck="false" required>
          <button class="panel-btn" type="submit">Save score</button>
        </form>
      `, false);

      const input = document.getElementById('initials');
      input.addEventListener('input', () => {
        input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      });
      setTimeout(() => input.focus(), 50);

      document.getElementById('initials-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = input.value.trim();
        if (!name) return;
        const entry = { name, score, time: Date.now() };
        const top = await scoreStore.save(level, entry);
        showLeaderboard(level, top, entry, 'Nice!');
      });
    }

    function showLeaderboard(level, list, myEntry, message) {
      const rows = list.map((e, i) => `
        <tr class="${myEntry && e.time === myEntry.time && e.name === myEntry.name ? 'me' : ''}">
          <td>${i + 1}</td><td>${escapeHtml(e.name)}</td><td>${e.score}</td>
        </tr>`).join('');

      showPanel(`
        <h1>Time's up!</h1>
        <div class="big-score">${score}</div>
        ${message ? `<p>${message}</p>` : ''}
        <div class="board-title">${level} top ten</div>
        ${rows ? `<table class="board">${rows}</table>` : '<p class="muted">No scores yet.</p>'}
        <button class="panel-btn" id="again-btn">Play again</button>
      `);
    }

    function showStartPanel() {
      const ranked = RANKED_LEVELS.includes(currentDifficulty);
      showPanel(`
        <h1>Catch the Ball</h1>
        <p>You have <b>${START_SECONDS} seconds</b>. Every hit adds <b>+${SECONDS_PER_HIT}s</b>.</p>
        <p class="muted">${ranked ? `Playing <b>${currentDifficulty}</b> - top ten scores go on the leaderboard.` : 'Easy is practice mode - no leaderboard.'}</p>
        <button class="panel-btn" id="start-btn">Start</button>
      `);
    }

    function showPanel(html, wireButtons = true) {
      panel.innerHTML = html;
      overlay.classList.remove('hidden');
      if (!wireButtons) return;
      const start = document.getElementById('start-btn');
      if (start) start.addEventListener('click', startGame);
      const again = document.getElementById('again-btn');
      if (again) again.addEventListener('click', () => { resetGame(); });
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Proximity evasion check for both mouse and touch
    function checkProximity(clientX, clientY) {
      if (!playing) return;
      evadeFrom(circle, clientX, clientY);
      if (mirage) evadeFrom(mirage, clientX, clientY);
    }

    function evadeFrom(el, clientX, clientY) {
      const size = getCircleSize();
      const rect = el.getBoundingClientRect();
      const centerX = rect.left + size / 2;
      const centerY = rect.top + size / 2;

      const dist = Math.hypot(clientX - centerX, clientY - centerY);
      const threshold = (size / 2) + difficultyConfig[currentDifficulty].evadeDistance;

      if (dist < threshold) {
        moveCircle(clientX, clientY, el);
      }
    }

    // Mouse movement evasion
    window.addEventListener('mousemove', (e) => {
      checkProximity(e.clientX, e.clientY);
    });

    // Mobile touch evasion (when dragging finger across the screen)
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        checkProximity(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    // Mobile: a tap that misses still spooks the circle if it lands close
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        checkProximity(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    // Handle hit event (works for both click and touch tap)
    function handleHit(e) {
      e.preventDefault();
      e.stopPropagation();
      registerHit();
    }

    function registerHit() {
      if (!playing) return;

      const before = score;
      const points = isActive('gold') ? 2 : 1;
      const penalty = isActive('black');
      score = penalty ? Math.max(0, score - points) : score + points;
      // Double points can jump past a multiple, so check for crossing it
      const passed = (n) => Math.floor(before / n) < Math.floor(score / n);
      const reached = (n) => before < n && score >= n;

      scoreDisplay.textContent = score;
      addTime(SECONDS_PER_HIT);
      if (penalty) sfx.minus();
      else sfx.hit(score);

      // Randomize colors every 5 points
      if (passed(5)) {
        randomizeColors();
      }

      // Milestones for emojis (disappears after 5 seconds)
      if (reached(50)) {
        showEmoji('🤬'); // Swearing
      } else if (reached(20)) {
        showEmoji('😠'); // Angry
      } else if (reached(10)) {
        showEmoji('🙁'); // Sad
      }

      if (gemType) collectGem();

      if (passed(HITS_PER_SPEEDUP)) {
        applySpeed();
        showToast('Faster!');
        music.updateTempo();
      }

      moveCircle();
      startAutoMove();
    }

    circle.addEventListener('click', handleHit);
    circle.addEventListener('touchstart', handleHit, { passive: false });

    // ---- Sound ----
    // Everything is synthesized live with the Web Audio API (no audio files):
    // an 80s video game style metal loop that speeds up with the game, plus hit sounds.
    const SOUND_PREF_KEY = 'catch-the-ball-muted';
    let audioCtx = null;
    let masterGain = null;
    let noiseBuffer = null;
    let muted = false;
    try { muted = localStorage.getItem(SOUND_PREF_KEY) === '1'; } catch (e) {}

    const MUSIC_BASE_BPM = { easy: 132, medium: 140, hard: 148 };
    const BPM_PER_SPEEDUP = 8;
    const MAX_BPM = 180;
    // 80s console style voices: pulse waves for riff and lead, triangle for
    // bass and kick, noise for snare and hats
    let pulse25 = null;
    let pulse12 = null;
    let musicBus = null;

    function ensureAudio() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return false;
      if (!audioCtx) {
        audioCtx = new Ctx();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = muted ? 0 : 0.5;
        const comp = audioCtx.createDynamicsCompressor();
        masterGain.connect(comp);
        comp.connect(audioCtx.destination);

        noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;

        pulse25 = makePulseWave(0.25);
        pulse12 = makePulseWave(0.125);
        musicBus = audioCtx.createGain();
        musicBus.gain.value = 1.0;
        musicBus.connect(masterGain);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return true;
    }

    const midiToFreq = (n) => 440 * Math.pow(2, (n - 69) / 12);

    // Pulse wave with a given duty cycle, like the NES sound chip. Only the
    // first 24 harmonics are kept, which takes the harsh edge off.
    function makePulseWave(duty) {
      const harmonics = 24;
      const real = new Float32Array(harmonics + 1);
      const imag = new Float32Array(harmonics + 1);
      for (let n = 1; n <= harmonics; n++) {
        real[n] = Math.sin(2 * Math.PI * n * duty) / (n * Math.PI);
        imag[n] = (1 - Math.cos(2 * Math.PI * n * duty)) / (n * Math.PI);
      }
      return audioCtx.createPeriodicWave(real, imag);
    }

    // One synth note: oscillator -> optional low-pass filter -> volume envelope
    function synthNote(type, midi, time, duration, volume, filterHz) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = midiToFreq(midi);
      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(volume, time + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
      let node = osc;
      if (filterHz) {
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = filterHz;
        osc.connect(filter);
        node = filter;
      }
      node.connect(gain);
      gain.connect(masterGain);
      osc.start(time);
      osc.stop(time + duration + 0.02);
    }

    function noiseHit(time, duration, volume, highpassHz, destination = masterGain) {
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = highpassHz;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(volume, time);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(destination);
      src.start(time);
      src.stop(time + duration + 0.02);
    }

    // Chip voice: one oscillator with a simple volume envelope
    function chip(wave, midi, time, duration, volume) {
      const osc = audioCtx.createOscillator();
      if (typeof wave === 'string') osc.type = wave;
      else osc.setPeriodicWave(wave);
      osc.frequency.value = midiToFreq(midi);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(volume, time + 0.004);
      gain.gain.setValueAtTime(volume, time + duration * 0.75);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
      osc.connect(gain);
      gain.connect(musicBus);
      osc.start(time);
      osc.stop(time + duration + 0.02);
      return osc;
    }

    // Triangle "thump" kick, the way old consoles faked a bass drum
    function kick(time) {
      const osc = audioCtx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(140, time);
      osc.frequency.exponentialRampToValueAtTime(45, time + 0.07);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.75, time);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.13);
      osc.connect(gain);
      gain.connect(musicBus);
      osc.start(time);
      osc.stop(time + 0.15);
    }

    function snare(time) {
      noiseHit(time, 0.12, 0.2, 1500, musicBus);
      chip('triangle', 52, time, 0.05, 0.3);
    }

    function tom(midi, time) {
      const osc = chip('triangle', midi, time, 0.16, 0.55);
      osc.frequency.exponentialRampToValueAtTime(midiToFreq(midi - 7), time + 0.16);
    }

    // Four-bar riff in E, written in 16th-note steps.
    // Each step is [semitones above the bar's root, open (held) note?] or null.
    const RIFF_ROOTS = [52, 52, 48, 50]; // E, E, C, D
    const RIFF = [
      [0, true], [0, false], [0, false], null,
      [0, false], [0, false], [3, true], null,
      [0, false], [0, false], [5, true], null,
      [0, false], [7, true], [5, true], [3, false]
    ];
    const KICKS = new Set([0, 3, 6, 8, 11, 14]);
    const FILL_TOMS = [57, 53, 50, 45];
    // Heroic lead for the second half of the 8-bar loop, one note per 8th
    const LEAD = [
      [64, null, 67, 69, 71, null, 69, 67],
      [71, null, 74, 76, 74, null, 71, null],
      [72, null, 71, 69, 67, null, 64, null],
      [66, null, 67, 69, 71, null, null, null]
    ];

    const music = {
      timer: null,
      step: 0,
      nextTime: 0,
      bpm: 112,

      start() {
        if (!ensureAudio()) return;
        this.stop();
        this.updateTempo();
        this.step = 0;
        this.nextTime = audioCtx.currentTime + 0.06;
        // Schedule slightly ahead of time so timing stays tight
        this.timer = setInterval(() => this.schedule(), 25);
      },

      stop() {
        clearInterval(this.timer);
        this.timer = null;
      },

      updateTempo() {
        const steps = Math.floor(score / HITS_PER_SPEEDUP);
        this.bpm = Math.min(MAX_BPM, MUSIC_BASE_BPM[currentDifficulty] + steps * BPM_PER_SPEEDUP);
      },

      schedule() {
        while (this.nextTime < audioCtx.currentTime + 0.12) {
          this.playStep(this.step, this.nextTime);
          this.nextTime += 60 / this.bpm / 4;
          this.step = (this.step + 1) % 128;
        }
      },

      playStep(step, t) {
        const section = Math.floor(step / 64); // 0 = riff, 1 = riff + lead
        const bar = Math.floor(step / 16) % 4;
        const s = step % 16;
        const sixteenth = 60 / this.bpm / 4;
        const isFill = bar === 3 && s >= 12;

        // Soft crash at the top of each half
        if (step % 64 === 0) noiseHit(t, 0.8, 0.07, 6000, musicBus);

        if (isFill) {
          // Tom roll down into the next part, with one chord held over it
          tom(FILL_TOMS[s - 12], t);
          if (s === 12) {
            chip(pulse25, RIFF_ROOTS[bar], t, sixteenth * 4, 0.07);
            chip(pulse25, RIFF_ROOTS[bar] + 7, t, sixteenth * 4, 0.05);
            chip('triangle', RIFF_ROOTS[bar] - 12, t, sixteenth * 4, 0.3);
          }
          return;
        }

        // Drums: kick follows the riff, gallops on the 3rd bar, snare on 2 and 4
        if (KICKS.has(s) || (bar === 2 && s % 2 === 0)) kick(t);
        if (s === 4 || s === 12) snare(t);
        if (s % 2 === 0) noiseHit(t, 0.025, 0.04, 9000, musicBus);

        // Riff: chugging pulse "power chords" over triangle bass
        const hit = RIFF[s];
        if (hit) {
          const [offset, open] = hit;
          const note = RIFF_ROOTS[bar] + offset;
          const len = sixteenth * (open ? 1.8 : 0.7);
          chip(pulse12, note, t, len, open ? 0.07 : 0.055);
          chip(pulse12, note + 7, t, len, open ? 0.05 : 0.035);
          chip('triangle', note - 12, t, len, 0.3);
        }

        // Lead melody in the second half
        if (section === 1 && s % 2 === 0) {
          const lead = LEAD[bar][s / 2];
          if (lead) chip(pulse25, lead, t, sixteenth * 1.9, 0.06);
        }
      }
    };

    const sfx = {
      // Bright two-note blip that climbs a pentatonic scale as you score
      hit(n) {
        if (!ensureAudio()) return;
        const scale = [0, 3, 5, 7, 10];
        const i = (n - 1) % 10;
        const note = 79 + scale[i % 5] + (i >= 5 ? 12 : 0);
        const t = audioCtx.currentTime;
        synthNote('square', note, t, 0.07, 0.16);
        synthNote('square', note + 7, t + 0.05, 0.1, 0.13);
      },

      // Low buzz for hitting the fake ball
      mirage() {
        if (!ensureAudio()) return;
        const t = audioCtx.currentTime;
        synthNote('sawtooth', 43, t, 0.18, 0.2, 700);
        synthNote('sawtooth', 44, t, 0.18, 0.15, 700);
      },

      // Sad "wah-wah" when a hit costs points
      minus() {
        if (!ensureAudio()) return;
        const t = audioCtx.currentTime;
        synthNote('square', 55, t, 0.1, 0.12, 2000);
        synthNote('square', 50, t + 0.08, 0.16, 0.12, 2000);
      },

      // Soft sparkle when a diamond appears
      gemAppear() {
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        synthNote('triangle', 88, t, 0.08, 0.08);
        synthNote('triangle', 93, t + 0.07, 0.12, 0.07);
      },

      // Collect jingle: rising for good diamonds, falling for the red one
      gem(type) {
        if (!ensureAudio()) return;
        const t = audioCtx.currentTime;
        const notes = {
          blue: [72, 76, 79, 84],
          gold: [76, 79, 84, 88],
          green: [67, 71, 74, 79],
          red: [84, 79, 75, 72],
          black: [60, 56, 53, 48]
        }[type];
        notes.forEach((note, i) => synthNote('square', note, t + i * 0.06, 0.1, 0.11, 5000));
      },

      // Falling "game over" jingle
      gameOver() {
        if (!audioCtx) return;
        const t = audioCtx.currentTime + 0.05;
        [72, 67, 64, 60].forEach((note, i) => {
          synthNote('square', note, t + i * 0.16, 0.22, 0.12, 3000);
        });
      }
    };

    function renderSoundButton() {
      const btn = document.getElementById('sound-btn');
      btn.textContent = muted ? '🔇' : '🔊';
      btn.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
    }

    function toggleSound() {
      muted = !muted;
      try { localStorage.setItem(SOUND_PREF_KEY, muted ? '1' : '0'); } catch (e) {}
      if (masterGain) masterGain.gain.value = muted ? 0 : 0.5;
      renderSoundButton();
    }

    renderSoundButton();

    // ---- Tap marks ----
    // Every tap or click during a round leaves a mark that fades over 3 seconds.
    // Real hits are red; misses (including hits on the mirage) are white.
    function addTapMark(x, y, isHit) {
      const mark = document.createElement('div');
      mark.className = isHit ? 'tap-mark hit' : 'tap-mark';
      mark.style.left = `${x}px`;
      mark.style.top = `${y}px`;
      mark.addEventListener('animationend', () => mark.remove());
      document.body.appendChild(mark);
    }

    // Capture phase so it sees the tap before the hit handlers stop it
    window.addEventListener('pointerdown', (e) => {
      const target = e.target instanceof Element ? e.target : null;
      if (!playing || (target && target.closest('button'))) return;
      let isHit = !!(target && target.closest('#circle'));

      // Green diamond: a tap close to the real ball counts as a hit
      if (!isHit && isActive('green') && !(target && target.closest('.mirage'))) {
        const r = circle.getBoundingClientRect();
        const dist = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
        if (dist <= r.width / 2 + GREEN_RANGE_PX) {
          isHit = true;
          registerHit();
        }
      }

      addTapMark(e.clientX, e.clientY, isHit);
    }, true);

    // ---- Lock the screen in place ----
    // Phones (especially iPhones) ignore user-scalable=no, so block pinch zoom,
    // double-tap zoom and dragging the page around in code.
    const allowsScroll = (target) => target instanceof Element && target.closest('#panel');

    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 1 || !allowsScroll(e.target)) e.preventDefault();
    }, { passive: false });

    ['gesturestart', 'gesturechange', 'gestureend'].forEach(type => {
      document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
    });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      const isControl = e.target instanceof Element && e.target.closest('button, input');
      if (now - lastTouchEnd < 350 && !isControl) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    document.addEventListener('dblclick', (e) => e.preventDefault());

    // Desktop: ctrl + scroll wheel and ctrl +/- zoom
    window.addEventListener('wheel', (e) => {
      if (e.ctrlKey) e.preventDefault();
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault();
    });

    // Initialize
    setDifficulty('medium');
    window.addEventListener('resize', () => { if (!playing) centerCircle(); });
  </script>
</body>
</html>
